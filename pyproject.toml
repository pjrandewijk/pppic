[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pppic"
version = "1.0.0"
description = "A dpic-compatible PIC processor in pure Python, producing PSTricks (dpic -p)"
readme = "README.md"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Peter Jan Randewijk" }]
requires-python = ">=3.10"
keywords = ["pic", "dpic", "gpic", "pstricks", "latex", "circuit macros", "diagrams"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Text Processing :: Markup :: LaTeX",
]

[project.urls]
Homepage = "https://github.com/pjrandewijk/pppic"
Issues = "https://github.com/pjrandewijk/pppic/issues"
"Used by" = "https://github.com/pjrandewijk/m4cmpy"

[project.scripts]
pppic = "pppic:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["pppic"]
