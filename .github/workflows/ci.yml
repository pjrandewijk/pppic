name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v

  with-pym4:
    name: pym4 | pppic on a Circuit Macros diagram
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install . git+https://github.com/pjrandewijk/pym4
      - name: Get Circuit Macros from CTAN
        # mirrors.ctan.org picks a random mirror and some fail TLS checks: retry it, then use ctan.net
        run: |
          for url in https://mirrors.ctan.org/graphics/circuit_macros.zip \
                     https://mirrors.ctan.org/graphics/circuit_macros.zip \
                     https://ctan.net/graphics/circuit_macros.zip; do
            curl -fsSL -o cm.zip "$url" && break
          done
          unzip -q cm.zip
      - name: Expand and compile
        run: |
          curl -fsSL -o circuit.m4 https://raw.githubusercontent.com/pjrandewijk/pym4/HEAD/examples/circuit.m4
          pym4 -I circuit_macros circuit.m4 | pppic -p > circuit.tex
          grep -q 'begin{pspicture}' circuit.tex
          cat circuit.tex
